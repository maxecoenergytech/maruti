name: CI - Maruti CRM Test & Audit Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  audit-and-test:
    name: System Audit & Feature Tests (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, curl, gd, zip
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create Storage Directory & Link
        run: |
          mkdir -p storage/app/backups
          chmod -R 777 storage bootstrap/cache
          php artisan storage:link

      - name: Setup Database & Run Seeders
        run: |
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Start Background Web Server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3

      - name: Run Comprehensive Developer Hard-Test & Audit
        run: php artisan app:audit-system --detailed

      - name: Run Full PHPUnit Test Suite
        run: php artisan test --colors=always
